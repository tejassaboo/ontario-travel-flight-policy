_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a provincial government's real travel directive: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under Ontario's Travel, Meal and Hospitality Expenses Directive (last amended January 2020), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and directive section. A deterministic verifier rebuilds the offers and the directive's answer itself and checks every field. Twenty-four cases cover the lowest fare that still arrives in time, who approves a trip by organisation, role and destination, special status that has lapsed, written delegations, business class and who may approve it, contractors, commutes, cancelled trips, and the directive's own unclear words."
highlights:
  - "The verbatim directive: no paraphrase, no rules restated in the task"
  - "Approval charts by organisation, role and destination tier, with delegations and special status"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example alder-quay, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the directive's answer and checks every field"
